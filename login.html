<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSense OS — Authentication Portal</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       DARK GLASSMORPHISM SAAS DESIGN SYSTEM (Login Portal)
       ========================================================================== */
    :root {
      --bg-base: #070a12;
      --bg-surface: rgba(17, 24, 39, 0.8);
      --bg-card: rgba(26, 35, 54, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-glow: rgba(99, 102, 241, 0.4);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #3b82f6 100%);
      --accent-indigo: #6366f1;

      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      --shadow-card: 0 16px 40px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-color);
      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      animation: fadeInScale 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-color-glow);
      box-shadow: var(--shadow-card);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
      overflow: hidden;
    }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .brand-logo-icon svg { width: 28px; height: 28px; fill: #ffffff; }

    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

    .form-input {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: all 150ms ease;
    }

    .form-input:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      background: var(--accent-gradient);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-glow);
      transition: all 200ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.5);
    }

    .alert-error {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #f87171;
      font-size: 13px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-error.active { display: flex; }

    .hint-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hint-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #a5b4fc; }
    .hint-item { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .hint-code {
      font-family: monospace; font-weight: 600; color: #ffffff;
      background: rgba(255, 255, 255, 0.08); padding: 2px 8px; border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        </div>
        <h1 class="brand-title">ShopSense OS</h1>
        <p class="brand-subtitle">Multi-Vendor E-Commerce Analytics Portal (₹ INR)</p>
      </div>

      <div class="alert-error" id="error-alert">
        <svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-message">Invalid credentials</span>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" style="display:flex; flex-direction:column; gap:18px;">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="admin@shopsense.com" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span>Authenticate</span>
          <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="hint-box">
        <span class="hint-title">💡 Quick Autofill Demo Accounts</span>
        <div class="hint-item">
          <span>System Admin:</span>
          <span class="hint-code" onclick="fillCredentials('admin@shopsense.com', 'admin')" style="cursor:pointer;" title="Click to autofill">admin@shopsense.com / admin</span>
        </div>
        <div class="hint-item">
          <span>Active Vendor (Sony):</span>
          <span class="hint-code" onclick="fillCredentials('contact@sony.com', 'vendor123')" style="cursor:pointer;" title="Click to autofill">contact@sony.com / vendor123</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.includes('http') ? window.location.origin : 'http://127.0.0.1:8000';

    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      hideError();
    }

    function showError(message) {
      const alertBox = document.getElementById('error-alert');
      document.getElementById('error-message').textContent = message;
      alertBox.classList.add('active');
    }

    function hideError() {
      document.getElementById('error-alert').classList.remove('active');
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideError();

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = 'Authenticating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || 'Invalid credentials');
        }

        sessionStorage.setItem('access_token', result.access_token);
        sessionStorage.setItem('role', result.role);
        sessionStorage.setItem('status', result.status);
        sessionStorage.setItem('vendor_id', result.vendor_id);
        sessionStorage.setItem('name', result.name);
        sessionStorage.setItem('email', result.email);

        if (result.role === 'admin') {
          window.location.href = 'admin_dashboard.html';
        } else {
          window.location.href = 'vendor_dashboard.html';
        }

      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Authenticate</span> <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
      }
    }
  </script>
</body>
</html>
